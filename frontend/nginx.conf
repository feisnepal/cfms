server {
    # H5.1: 8080, not 80. The image runs as a non-root user now, and a non-root
    # process cannot bind a port below 1024. docker-compose still publishes 3001;
    # only the container-side port moved. These two must change together — a
    # mismatch here is the exact S1-26 defect (published port bound to nothing)
    # that left the frontend unreachable until H1.10.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Community forum, for search engines (FORUM_SPEC.md F1b). The backend writes the question into the app's own index.html, so a person
    # still gets the app (React replaces the content when it starts). Needs FORUM_SPA_INDEX_PATH to point at this build's index.html.
    location ~ ^/forum/q/([0-9a-fA-F-]{36})$ {
        rewrite ^/forum/q/(.*)$ /api/forum/pages/q/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /sitemap.xml {
        rewrite ^ /api/forum/sitemap.xml break;
        proxy_pass http://backend:8000;
    }
    location = /robots.txt {
        rewrite ^ /api/forum/robots.txt break;
        proxy_pass http://backend:8000;
    }

    # R-3 smoke and the scheduler probe the backend's liveness through this
    # origin, so /health must reach the backend — not fall through to the SPA.
    location = /health {
        proxy_pass http://backend:8000;
    }
    location = /ready {
        proxy_pass http://backend:8000;
    }

    # Proxy API to backend (backend serves /api and /docs)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    location /docs {
        proxy_pass http://backend:8000;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
    }
}

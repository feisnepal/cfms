# Alertmanager (H5.7).
#
# ⚠ NO NOTIFICATION CHANNEL IS CONFIGURED. Alerts land in the Alertmanager UI
# and reach nobody. This is deliberate rather than a guess — a wrong webhook is
# worse than an obvious blank, because it fails silently.
#
# PICK ONE BEFORE GO-LIVE. Uncomment and fill:
#
#   receivers:
#     - name: default
#       email_configs:
#         - to: ops@example.np
#           from: alerts@example.np
#           smarthost: smtp.example.np:587
#           auth_username: alerts@example.np
#           auth_password_file: /etc/alertmanager/smtp_password
#
#   ...or slack_configs with a webhook in a *_file field.

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  # A page repeats hourly; a ticket once a day. Anything more frequent trains
  # people to dismiss without reading.
  repeat_interval: 1h
  routes:
    - matchers: [severity = "ticket"]
      receiver: default
      repeat_interval: 24h

receivers:
  - name: default

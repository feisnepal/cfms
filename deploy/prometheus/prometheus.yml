# Prometheus for the single-VPS deployment (H5.7).
# Runs under the `monitoring` compose profile, so a plain deploy does not start it.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/slo-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cfms-backend
    metrics_path: /metrics
    # /metrics is behind METRICS_TOKEN (H2.10) because it names every route,
    # its call volume and its latency — which maps the application and leaks
    # usage patterns for a system holding household data.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["backend:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

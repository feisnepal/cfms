# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# The path separator used here should be the separator specified by "version_path_separator" below.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", which uses os.pathsep.
# If this key is omitted entirely, it falls back to the legacy behavior of splitting on spaces and/or commas.
# Valid values for version_path_separator are:
#
# version_path_separator = :
# version_path_separator = ;
# version_path_separator = space
version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# H1.13 / S2-69: deliberately empty. This file is tracked in git, and it used to
# carry the live database password in plain text — recoverable from any clone,
# forever, regardless of later rotation.
#
# Worse than the credential was the silent default. env.py read only this value,
# so EVERY `alembic upgrade`, `downgrade` and `check` targeted this one database
# no matter what the caller set. A migration aimed at a scratch database during
# this work silently hit production instead; it was a no-op only because
# production happened to already be at head.
#
# The target now comes from DATABASE_URL. env.py resolves it in this order, and
# an explicitly exported variable always wins — which is what makes a run aimed
# at a scratch database actually go there:
#
#     1. DATABASE_URL exported in the environment
#     2. DATABASE_URL from backend/.env        (local development)
#     3. a value set programmatically on this config (the test harness does)
#     4. nothing -> RuntimeError, rather than a guess
#
# Step 2 means a developer with a .env still gets their local database without
# ceremony. Steps 1 and 4 are the ones that matter: an explicit target is never
# overridden, and CI or a deploy that forgets to set one fails loudly instead of
# silently migrating whatever this file used to point at.
#
#     DATABASE_URL=postgresql://user:pass@host:5432/dbname alembic upgrade head
#
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

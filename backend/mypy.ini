[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = False
disallow_untyped_defs = False
check_untyped_defs = False
no_implicit_optional = False
show_error_codes = True
exclude = (venv|tests|\.venv|alembic)

# Per-module: start tightening on the small, high-value core modules.
[mypy-app.core.*]
disallow_untyped_defs = True

[mypy-shapely.*]
ignore_missing_imports = True

[mypy-rasterio.*]
ignore_missing_imports = True

[mypy-geopandas.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

name: Comment Lint

on:
  pull_request:
    paths:
      - 'backend/**/*.py'
      - 'frontend/src/**/*.{ts,tsx}'
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff — docstring lint (D rules)
        run: ruff check backend/app/ --select D --ignore D107,D203,D213,D404,D415

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: ESLint — JSDoc check
        run: |
          npx eslint frontend/src/ --rule "jsdoc/require-jsdoc: warn"